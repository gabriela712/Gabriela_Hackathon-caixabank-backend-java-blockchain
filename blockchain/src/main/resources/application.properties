spring.application.name=blockchain

# application.properties file
server.port=3000
spring.datasource.url=jdbc:mysql://mysql://localhost:3306/blockchain
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.main.allow-circular-references=true
server.error.include-message=always

# CSRF
spring.security.csrf.enabled=false

# Logging
logging.level.root=DEBUG
logging.level.org.springframework=DEBUG
logging.level.com.hackathon.blockchain=DEBUG

# Cookies
spring.session.store-type=jdbc
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800s
servidor.servlet.session.cookie.http-only=true
servidor.servlet.session.cookie.secure=true

# Additional properties for blockchain functionality
# Blockchain configuration
blockchain.difficulty=4
blockchain.mining.reward=50
blockchain.initial.supply=21000000

# Smart Contract configuration
smartcontract.evaluation.timeout=5000
smartcontract.max.gas=1000000

# Wallet configuration
wallet.keys.directory=/app/keys
wallet.initial.fiat.balance=100000

# Market Data configuration
market.data.update.interval=60000
market.data.api.url=https://faas-lon1-917a94a7.doserverless.co/api/v1/web/fn-3d8ede30-848f-4a7a-acc2-22ba0cd9a382/default/fake-market-prices

# Initial Pool Configuration
pool.initial.btc=100000
pool.initial.eth=400000
pool.initial.usdt=1000000
pool.initial.ncoin=10000000
pool.initial.ccoin=2000000

